<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vokabeltrainer — عِلْم mit Ḥarakah">
<title>Entwurf H — عِلْم mit rotem Vokalzeichen</title>
<!-- ⭐ Der Schriftzug ist NICHT von mir gezeichnet: es ist genau der Pfad aus
     dem bisherigen Icon, also aus einer echten Schrift abgeleitet und
     nachweislich richtig. Ein selbst gemaltes arabisches Wort wäre der eine
     Fehler, der sich nie von allein meldet — beim Korantrainer waren 10 von 28
     Mundbildern falsch, und keine einzige maschinelle Prüfung hat es gemerkt.

     Der Gedanke: das eine Rote ist ein VOKALZEICHEN. Genau daran arbeitet
     Elias jeden Tag, und genau das unterscheidet diese App vom Korantrainer —
     dort geht es ums Lesen, hier um die Ḥarakāt, die das Wort erst eindeutig
     machen.

     ⚠️ Der Punkt sitzt bewusst NICHT über einem bestimmten Buchstaben. Ein
     echtes Vokalzeichen an der falschen Stelle wäre eine falsche Aussage über
     die Sprache; ein freistehender Akzent darüber ist Gestaltung. -->
<rect width="512" height="512" rx="112" fill="#000000"/>
<!-- Der rote Akzent, hoch gesetzt wie eine Ḍammah über der Zeile -->
<circle cx="256" cy="118" r="26" fill="#ff2d4f"/>
