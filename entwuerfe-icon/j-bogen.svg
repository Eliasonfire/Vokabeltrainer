<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vokabeltrainer — عِلْم im Fortschrittsbogen">
<title>Entwurf J — عِلْم im Fortschrittsbogen</title>
<!-- ⭐ Der Schriftzug ist NICHT von mir gezeichnet: derselbe Pfad wie im
     bisherigen Icon, aus einer echten Schrift abgeleitet. Selbst gemaltes
     Arabisch ist der eine Fehler, der sich nie von allein meldet.

     Der Gedanke: der Ring ist der Lernstand. Er läuft NICHT ganz herum — ein
     geschlossener Kreis hiesse „fertig", und beim Vokabellernen ist man das
     nie. Das rote Stück ist der Teil, der schon sitzt.

     Der Bogen beginnt oben und läuft nach RECHTS herum, also im Uhrzeigersinn
     wie eine Uhr — nicht in Leserichtung. Das ist Absicht: hier geht es um
     Zeit und Wiederholung, nicht um Schrift.

     ⚠️ Der Ring liegt bei r=196 und damit VOLLSTÄNDIG in der inneren Zone,
     die ein maskable Icon behält (80 % von 512 = 410 px Durchmesser um die
     Mitte, also r ≤ 205). Ein Ring, der bis an den Rand geht, wäre auf Android
     angeschnitten — und zwar auf jedem Gerät ein bisschen anders. -->
<rect width="512" height="512" rx="112" fill="#000000"/>

<!-- Der graue Rest des Rings: die offene Strecke -->
<circle cx="256" cy="256" r="196" fill="none" stroke="#3a3236" stroke-width="26"
        stroke-linecap="round" stroke-dasharray="1078 153" transform="rotate(-90 256 256)"/>
<!-- Das rote Stück: 45 % des Umfangs, oben beginnend -->
<circle cx="256" cy="256" r="196" fill="none" stroke="#ff2d4f" stroke-width="26"
        stroke-linecap="round" stroke-dasharray="485 746" transform="rotate(-90 256 256)"/>

