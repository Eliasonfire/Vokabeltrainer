<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Vokabeltrainer — Wortwurzel">
<title>Entwurf G — die Wortwurzel (drei Radikale)</title>
<!-- Das eine, was Arabisch von den Sprachen unterscheidet, die Elias kennt:
     drei Wurzelbuchstaben tragen eine ganze Wortfamilie. Genau das ist auch
     ein eigener Modus der App.
     Drei Punkte auf einer Linie, aus denen Äste wachsen — der mittlere rot,
     weil dort die Familie ansetzt. -->
<rect width="512" height="512" rx="112" fill="#000000"/>
<g fill="none" stroke="#f3ecef" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
  <!-- Die drei Äste nach oben -->
  <path d="M256 300V196"/>
  <path d="M256 232 154 150"/>
  <path d="M256 232 358 150"/>
</g>
<!-- Die drei Radikale als Punkte, der Ansatzpunkt rot -->
<g fill="#f3ecef">
  <circle cx="154" cy="150" r="30"/>
  <circle cx="358" cy="150" r="30"/>
</g>
<circle cx="256" cy="196" r="30" fill="#ff2d4f"/>
<!-- Der Stamm steht auf einer Grundlinie -->
<g fill="none" stroke="#9c9095" stroke-width="20" stroke-linecap="round">
  <path d="M168 348h176"/>
  <path d="M196 396h120"/>
</g>
<g fill="none" stroke="#f3ecef" stroke-width="22" stroke-linecap="round">
  <path d="M256 300v48"/>
</g>
</svg>
